<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Notebook Preview</title>
    <script>
        // Set the theme before first paint so the page never flashes the wrong
        // palette. theme.ts owns the logic; this mirrors its startup choice.
        try {
            var stored = localStorage.getItem('webnb-preview-theme');
        } catch (e) { /* privacy mode */ }
        // Anything but a pinned light/dark means "auto": follow the OS.
        document.documentElement.dataset.theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
